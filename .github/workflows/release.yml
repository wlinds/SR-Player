name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: SR-Player-macos.zip
            asset_name: SR-Player-${{ github.ref_name }}-macos.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sr-player-linux.tar.gz
            asset_name: sr-player-${{ github.ref_name }}-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sr-player-windows.zip
            asset_name: sr-player-${{ github.ref_name }}-windows.zip
            msi_name: sr-player-${{ github.ref_name }}-setup.msi

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Install cargo-bundle (macOS only)
      if: matrix.os == 'macos-latest'
      run: cargo install cargo-bundle

    - name: Build macOS app bundle
      if: matrix.os == 'macos-latest'
      run: cargo bundle --release

    - name: Import Code Signing Certificate (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import certificate
        echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
        security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

        # Allow codesign to access the key
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Sign macOS app
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      run: |
        APP_PATH="target/release/bundle/osx/SR Player.app"

        # Verify signing identity exists
        echo "Verifying signing identity: $APPLE_CERTIFICATE_NAME"
        security find-identity -v -p codesigning

        # Sign the app with hardened runtime (required for notarization)
        codesign --force --deep --options runtime --sign "$APPLE_CERTIFICATE_NAME" \
          --timestamp "$APP_PATH"

        # Verify signature
        codesign --verify --deep --strict "$APP_PATH"

    - name: Notarize macOS app
      if: matrix.os == 'macos-latest'
      continue-on-error: true
      timeout-minutes: 30
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        APP_PATH="target/release/bundle/osx/SR Player.app"

        # Create ZIP for notarization
        ditto -c -k --keepParent "$APP_PATH" "SR-Player-notarize.zip"

        echo "Submitting to Apple Notary Service..."

        # Submit for notarization with retry logic
        MAX_RETRIES=3
        RETRY_COUNT=0
        SUBMISSION_ID=""

        while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ -z "$SUBMISSION_ID" ]; do
          echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES to submit..."

          SUBMIT_OUTPUT=$(xcrun notarytool submit "SR-Player-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            2>&1 || true)

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -n1 | awk '{print $2}')

          if [ -z "$SUBMISSION_ID" ]; then
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Submission failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          fi
        done

        if [ -z "$SUBMISSION_ID" ]; then
          echo "Failed to get submission ID after $MAX_RETRIES attempts"
          exit 1
        fi

        echo "Submission ID: $SUBMISSION_ID"
        echo "Waiting for notarization (polling for up to 30 minutes)..."

        # Poll for notarization status with timeout
        MAX_WAIT_SECONDS=1800  # 30 minutes
        WAIT_INTERVAL=15       # Check every 15 seconds
        ELAPSED=0
        STATUS="In Progress"

        while [ $ELAPSED -lt $MAX_WAIT_SECONDS ] && [ "$STATUS" = "In Progress" ]; do
          sleep $WAIT_INTERVAL
          ELAPSED=$((ELAPSED + WAIT_INTERVAL))

          # Only print status every minute to reduce log spam
          if [ $((ELAPSED % 60)) -eq 0 ] || [ $ELAPSED -eq 15 ]; then
            echo "Checking status (${ELAPSED}s / ${MAX_WAIT_SECONDS}s elapsed)..."
          fi

          INFO_OUTPUT=$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1 || true)

          # Check for network errors
          if echo "$INFO_OUTPUT" | grep -q "NSURLErrorDomain\|connection.*offline\|HTTPError"; then
            echo "Network error detected, retrying..."
            continue
          fi

          # Only print output every minute to reduce log spam
          if [ $((ELAPSED % 60)) -eq 0 ] || [ $ELAPSED -eq 15 ]; then
            echo "$INFO_OUTPUT"
          fi

          STATUS=$(echo "$INFO_OUTPUT" | grep "status:" | awk '{print $2}')

          if [ "$STATUS" = "Accepted" ]; then
            echo "Notarization completed successfully"

            # Staple the notarization ticket to the app
            echo "Stapling notarization ticket..."
            xcrun stapler staple "$APP_PATH"
            break
          elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
            echo "Notarization failed with status: $STATUS"
            echo "Getting detailed logs..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || echo "Could not retrieve logs"
            exit 1
          fi
        done

        if [ $ELAPSED -ge $MAX_WAIT_SECONDS ] && [ "$STATUS" = "In Progress" ]; then
          echo "Notarization timed out after ${MAX_WAIT_SECONDS}s"
          echo "WARNING: App is code-signed but not notarized. Users will need to use 'Open Anyway' in System Settings."
          exit 1
        fi

        # Clean up
        rm "SR-Player-notarize.zip"

    - name: Build Linux binary
      if: matrix.os == 'ubuntu-latest'
      run: cargo build --release

    - name: Install cargo-wix (Windows only)
      if: matrix.os == 'windows-latest'
      run: cargo install cargo-wix

    - name: Build Windows binary
      if: matrix.os == 'windows-latest'
      run: cargo build --release

    - name: Build Windows MSI installer
      if: matrix.os == 'windows-latest'
      run: cargo wix --nocapture

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        cd target/release/bundle/osx
        zip -r "SR-Player-${{ github.ref_name }}-macos.zip" "SR Player.app"
        mv "SR-Player-${{ github.ref_name }}-macos.zip" ../../../..

    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p package
        cp target/release/sr-player package/
        cp README.md package/
        tar -czf "sr-player-${{ github.ref_name }}-linux.tar.gz" -C package .

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p package
        cp target/release/sr-player.exe package/
        cp README.md package/
        cd package
        7z a "../sr-player-${{ github.ref_name }}-windows.zip" *
        cd ..
        # Copy MSI installer to root for upload
        cp target/wix/*.msi "sr-player-${{ github.ref_name }}-setup.msi"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-release
        path: |
          SR-Player-${{ github.ref_name }}-macos.zip
          sr-player-${{ github.ref_name }}-linux.tar.gz
          sr-player-${{ github.ref_name }}-windows.zip
          sr-player-${{ github.ref_name }}-setup.msi

  create-release:
    name: Create Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: SR Player ${{ github.ref_name }}
        body: |
          ## SR Player ${{ github.ref_name }}

          A fast and lightweight desktop app for streaming Sveriges Radio live channels and podcasts.

          ### Features
          - Stream all Sveriges Radio live channels with instant switching
          - Browse and play podcast episodes with caching
          - Favorites: Save your favorite channels and podcasts (persists across restarts)
          - Search: Find podcasts quickly with the search function
          - DVR buffer for time-shifted playback (rewind live radio)
          - Gapless audio playback with Symphonia decoder
          - Multi-channel background streaming pool
          - Real-time "Now Playing" information with program details
          - Cross-platform support (macOS, Linux, Windows)

          ### Installation

          #### macOS
          1. Download `SR-Player-${{ github.ref_name }}-macos.zip`
          2. Unzip the file
          3. Drag `SR Player.app` to your Applications folder
          4. Double-click to launch

          #### Linux
          1. Download `sr-player-${{ github.ref_name }}-linux.tar.gz`
          2. Extract: `tar -xzf sr-player-${{ github.ref_name }}-linux.tar.gz`
          3. Run: `./sr-player`
          4. Required dependencies: `libasound2`, `libxcb`, `libfontconfig`

          #### Windows

          **Option 1: MSI Installer (Recommended)**
          1. Download `sr-player-${{ github.ref_name }}-setup.msi`
          2. Double-click to install
          3. Follow the installation wizard
          4. Launch from Start Menu

          **Option 2: Portable (No Installation)**
          1. Download `sr-player-${{ github.ref_name }}-windows.zip`
          2. Extract the ZIP file
          3. Run `sr-player.exe`

          **Note:** Windows may show a security warning for unsigned software. Click "More info" → "Run anyway".

          ### What's New in v0.7.2

          **Fixes:**
          - Fix live stream dropping every ~10 seconds due to reqwest total response timeout
          - Add exponential backoff for stream reconnects with smart reset logic
          - Check for updates via GitHub Releases API

          **Previous Features:**
          - Favorites tab for quick access to your favorite channels and podcasts
          - Podcast search and episode playback with download caching
          - DVR buffer for rewinding live radio streams
          - Multi-channel support with instant channel switching
          - Gapless audio playback with Symphonia decoder
          - Cross-platform support (macOS, Linux, Windows) with MSI installer
        files: |
          **/SR-Player-${{ github.ref_name }}-macos.zip
          **/sr-player-${{ github.ref_name }}-linux.tar.gz
          **/sr-player-${{ github.ref_name }}-windows.zip
          **/sr-player-${{ github.ref_name }}-setup.msi
        draft: false
        prerelease: false

  update-website:
    name: Update Website Version
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_REPO_PAT }}
          repository: wlinds/React-Vite-Web-Template-2024
          event-type: update-version
          client-payload: '{"version": "${{ github.ref_name }}"}'

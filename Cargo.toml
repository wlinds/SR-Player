[package]
name = "sr-player"
path = "src/main.rs"
version = "0.6.0"
edition = "2021"

[dependencies]
slint = "1.9"
# Rodio for audio output (sink/device management)
# Keep symphonia-aac for M2 StreamingPlayer, add direct symphonia for M3
rodio = { version = "0.19", features = ["symphonia-aac", "minimp3"] }
# Symphonia for direct AAC decoding (custom Source implementation for M3)
# We use symphonia directly for gapless streaming
symphonia = { version = "0.5", features = ["aac", "mp3"] }
minimp3 = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
bytes = "1.5"
futures-util = "0.3"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
crossbeam-channel = "0.5"
chrono = "0.4"
chrono-tz = "0.10"
image = "0.25"
dirs = "5.0"

[build-dependencies]
slint-build = "1.9"
winresource = "0.1"

[profile.release]
strip = true          # Strip symbols from binary for smaller size
opt-level = "z"       # Optimize for size rather than speed
lto = true            # Enable link-time optimization
codegen-units = 1     # Better optimization (slower compile, smaller binary)
panic = "abort"       # Remove panic unwinding machinery

[package.metadata.bundle]
name = "SR Player"
identifier = "com.srplayer.app"
icon = ["src/assets/icons/icon.icns"]
category = "public.app-category.music"
short_description = "Sveriges Radio Player"
long_description = "A native macOS application for streaming Sveriges Radio channels with gapless playback"
version = "0.1.0"
copyright = "Copyright (c) 2025"

[package.metadata.wix]
upgrade-guid = "12345678-1234-1234-1234-123456789012"
path-guid = "22345678-1234-1234-1234-123456789012"
license = false
eula = false
